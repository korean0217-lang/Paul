<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>사도 바울과의 대화게임 - 디럭스</title>
<style>

:root{--ink:#2e241c;--gold:#e6b65b;--brown:#704629;--cream:#fff8e9;--paper:#fffdf7;--line:#dbc59e}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#f9efd8,#cbb28a 80%);color:var(--ink);font-family:'Gowun Dodum',sans-serif}
#game{max-width:980px;margin:auto;min-height:100vh;background:var(--paper);box-shadow:0 0 40px #3b291533;overflow:hidden}
header{padding:14px 18px;background:linear-gradient(135deg,#5d3a23,#8d5d36);color:#fff;display:flex;align-items:center;gap:14px}
.logo{font-family:Jua;font-size:25px;white-space:nowrap}.headright{flex:1}.stage{font-size:13px;opacity:.9}.meter{height:8px;background:#ffffff33;border-radius:99px;overflow:hidden;margin-top:5px}.meter>i{display:block;height:100%;background:var(--gold);width:0%;transition:.5s}
main{min-height:calc(100vh - 70px);padding:18px}
.scene{position:relative;min-height:245px;border-radius:22px;overflow:hidden;background:linear-gradient(#bfe0ef 0 62%,#d8b878 63%);border:3px solid #e4cfaa;box-shadow:inset 0 -25px 0 #c99d58}
.sun{position:absolute;width:70px;height:70px;border-radius:50%;background:#ffe28b;right:8%;top:10%;box-shadow:0 0 30px #ffe28b}
.cloud{position:absolute;background:#fff9;border-radius:99px;width:120px;height:32px;top:25px;animation:cloud 16s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:45px;height:45px;left:22px;top:-18px}.cloud:after{width:55px;height:55px;right:16px;top:-25px}.c2{top:80px;left:35%;animation-duration:22s}.c3{top:35px;left:70%;animation-duration:19s}@keyframes cloud{from{transform:translateX(-140px)}to{transform:translateX(1100px)}}
.road{position:absolute;bottom:0;left:0;right:0;height:78px;background:#c9a05e;clip-path:polygon(37% 0,63% 0,100% 100%,0 100%)}
.char{position:absolute;bottom:8px;left:7%;height:220px;filter:drop-shadow(0 7px 4px #4a321633);transition:.4s}.char.talk{animation:bob .7s infinite alternate}@keyframes bob{to{transform:translateY(-8px)}}
.char.small{height:180px;left:auto;right:7%}
.speech{margin:-20px auto 0;position:relative;max-width:820px;background:white;border:3px solid #8b623d;border-radius:22px;padding:18px 20px 16px;box-shadow:0 8px 0 #8b623d22;z-index:4}
.speech:after{content:"";position:absolute;left:70px;bottom:-18px;border:10px solid transparent;border-top-color:#8b623d}
.who{font-family:Jua;color:#7b4a2b;font-size:20px}.text{font-size:20px;line-height:1.55;margin-top:6px;min-height:62px}
.listen{float:right;margin-top:-34px;border:0;border-radius:99px;padding:7px 12px;background:#f3dfb7;color:#603d25;cursor:pointer}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.choice{border:2px solid var(--line);border-radius:16px;background:#fff;padding:16px;text-align:left;font:17px 'Gowun Dodum';cursor:pointer;transition:.2s;box-shadow:0 3px 0 #0000000a}
.choice:hover{transform:translateY(-2px);background:#fff5dc;border-color:#bd9150}.choice:disabled{cursor:default;opacity:.55}.choice.selected{background:#f5e2b9;border-color:#8b5a2b;opacity:1}
.feedback{display:none;margin-top:15px;padding:15px 17px;border-radius:15px;background:#f7efdf;border-left:5px solid #b57b37;line-height:1.6}
.next{display:none;margin-top:12px;width:100%;padding:15px;border:0;border-radius:15px;background:#744729;color:#fff;font:20px Jua;cursor:pointer}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{background:#eee1c8;border-radius:99px;padding:6px 10px;font-size:12px}
.start,.end,.routecard{text-align:center;padding:25px 10px}.start h2,.end h2{font:30px Jua;color:#704629}.start p,.end p{font-size:17px;line-height:1.7}
.hero{height:250px;display:block;margin:0 auto;filter:drop-shadow(0 12px 6px #0002)}.startbtn,.again{border:0;border-radius:15px;background:#744729;color:white;padding:16px 30px;font:21px Jua;cursor:pointer}
.verse{background:#f7efdf;border-left:5px solid #b47a35;padding:15px;margin:18px auto;max-width:720px;text-align:left}
.routegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.route{padding:10px 5px;border-radius:12px;background:#f3ead9;border:1px solid #ddc9a6;font-size:12px}.route b{display:block;font:18px Jua;color:#744729}
.routecard{display:none}.routecard.show{display:block}.routeicon{font-size:52px}
.shipscene{height:330px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#9dd0e8 0 55%,#6fb5ce 56%);border:3px solid #e2c995}.waves{position:absolute;bottom:0;height:130px;width:200%;background:repeating-radial-gradient(ellipse at 20% 20%,transparent 0 20px,#ffffff55 22px 27px,transparent 29px 50px);animation:waves 4s linear infinite}@keyframes waves{to{transform:translateX(-180px)}}
.boat{position:absolute;bottom:68px;left:42%;font-size:100px;animation:rock 1.4s ease-in-out infinite}@keyframes rock{50%{transform:rotate(-4deg) translateY(-5px)}}
.rome{position:absolute;right:7%;bottom:70px;font-size:95px;filter:drop-shadow(0 5px 3px #0002)}
.fire{position:absolute;left:10%;bottom:65px;font-size:60px;animation:flame .5s infinite alternate}@keyframes flame{to{transform:scale(1.12)}}
.timeline{display:flex;gap:5px;margin:14px 0}.dot{height:8px;flex:1;background:#eadfc8;border-radius:99px}.dot.on{background:#c98b3c}

/* 모바일 게임 UX */
#game{transition:opacity .25s ease,transform .25s ease}.fadeOut{opacity:0;transform:scale(.985)}
.toptools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.tool{border:0;border-radius:999px;padding:6px 9px;background:#ffffff22;color:#fff;font-size:12px;cursor:pointer}.tool:active{transform:scale(.96)}
.charWrap{position:absolute;bottom:8px;left:7%;height:220px;transition:.4s;filter:drop-shadow(0 7px 4px #4a321633)}
.charWrap .char{position:relative;left:auto;bottom:auto;height:220px;display:block}.charWrap.talk{animation:bob .7s infinite alternate}
.mouth{position:absolute;width:14px;height:7px;left:50%;top:45%;margin-left:-7px;border-radius:0 0 10px 10px;background:#6d2d22;opacity:0;transform:scaleY(.4);transition:.08s}
.talking .mouth{opacity:.8;animation:mouth 0.16s infinite alternate}@keyframes mouth{to{transform:scaleY(1.4);height:9px}}
.sceneTransition{animation:sceneIn .45s ease}@keyframes sceneIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.choice:active{transform:scale(.98)}
.savebar{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.savebar button{border:1px solid #d8c29e;background:#fff7e7;color:#704629;border-radius:10px;padding:7px 10px;font:13px 'Gowun Dodum';cursor:pointer}
.resume{margin:14px auto 0;padding:12px;border-radius:14px;background:#f5ead7;border:1px dashed #bb8b50;max-width:650px}
.endingChoice{font-size:16px;margin-top:8px}
@media(max-width:700px){.charWrap{height:185px;left:2%}.charWrap .char{height:185px}.mouth{top:45%;}.toptools{gap:4px}.tool{padding:6px 8px}}

@media(max-width:700px){.choices{grid-template-columns:1fr}.scene{min-height:215px}.char{height:185px;left:2%}.char.small{height:145px;right:2%}.text{font-size:18px}.speech{padding:15px}.logo{font-size:20px}.routegrid{grid-template-columns:repeat(2,1fr)}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b3924">
</head>
<body>
<div id="game">
<header><div class="logo">📜 사도 바울과의 대화</div><div class="headright"><div class="stage" id="stage">게임 시작</div><div class="meter"><i id="meter"></i></div></div><div class="toptools"><button class="tool" onclick="toggleMusic()" id="musicBtn">🎵</button><button class="tool" onclick="saveGame()">💾</button><button class="tool" onclick="loadGame()">↩️</button></div></header>
<main id="main"></main>
</div>

<script>

["A","유대인이 무서워서","두려움이 내 판단에 영향을 주었습니다.",0,2,0,0],

["C","스데반의 말이 하나님을 대적한다고 생각해서","나는 그것이 하나님을 위한 열심이라고 확신했습니다.",2,1,0,0],
["D","그냥 그래야 할 것 같아서","나는 군중과 시대의 흐름을 따라갔습니다.",0,0,1,1]]},
{scene:"다메섹으로 가는 길",pos:"main",who:"사울",q:"예수님을 믿는 사람들을 박해할 때, 무엇이 가장 중요하다고 생각했는가?",a:[
["A","율법에 대한 열심","하나님께 충성한다고 생각했습니다.",2,1,0,0],
["B","나의 명예","내가 옳다는 것을 증명하고 싶었습니다.",0,1,0,2],
["C","사람들의 안전","내가 지킨다고 생각했지만 오히려 상처를 주었습니다.",0,0,0,2],
["D","명령에 순종하는 것","다른 사람의 명령과 분위기를 따랐습니다.",0,0,2,0]]},

["C","아직 복음을 듣지 못한 지역으로 가는 것","개척의 길을 선택합니다.",0,1,2,0],

const routes={
teacher:{name:"말씀의 교사",icon:"📖",desc:"말씀을 깊이 가르치며 교회를 세우는 바울",pos:"writer",qs:[

function chooseRoute(){

}
